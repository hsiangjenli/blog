name: Build, publish, and deploy blog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'source/_posts/**/*.md'
  workflow_run:
    workflows: [Translate Posts]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blog-pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python tools/verify_translations.py
      - run: npm ci
      - run: npm run build
      - run: test -f public/api/posts.json
      - run: docker build --tag hsiangjenli/hexo-icarus:sha-${{ github.sha }} .

  publish-image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            hsiangjenli/hexo-icarus:latest
            hsiangjenli/hexo-icarus:sha-${{ github.sha }}

  deploy-pages:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-resume:
    needs: deploy-pages
    if: ${{ secrets.ROOT_SITE_DISPATCH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ROOT_SITE_DISPATCH_TOKEN }}
          repository: hsiangjenli/hsiangjenli.github.io
          event-type: blog-updated
